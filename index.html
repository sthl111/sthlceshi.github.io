<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>浪漫礼盒惊喜</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
<style>
  :root{
    --brown:#4a2c20;
    --brown-soft:#7a5a48;
    --gold:#b8893f;
    --gold-light:#e9cf8f;
    --wine-1:#c05a6e;
    --wine-2:#a03c50;
    --wine-3:#7e2839;
    --pink:#e9a7b8;
    --W:232px;
    --D:96px;
    --Hb:138px;
    --Hl:46px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
    color:var(--brown);
    overflow:hidden;
    background:
      radial-gradient(1100px 620px at 50% 30%, #fffdf8 0%, rgba(255,253,248,0) 60%),
      radial-gradient(900px 700px at 85% 90%, #f7e3d3 0%, rgba(247,227,211,0) 55%),
      radial-gradient(800px 600px at 10% 85%, #f9e9ec 0%, rgba(249,233,236,0) 55%),
      linear-gradient(168deg, #fdf9f2 0%, #f9eee0 52%, #f5e3d2 100%);
  }
  button{ min-height:2.25rem; font-family:inherit; }

  /* ---------- particle canvas ---------- */
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; }

  /* ---------- ambient background glow after opening ---------- */
  .bg-glow{
    position:fixed; left:50%; top:44%; width:120vmin; height:120vmin;
    transform:translate(-50%,-50%) scale(.35);
    background:radial-gradient(circle, rgba(255,214,140,.55) 0%, rgba(244,183,120,.22) 38%, rgba(244,183,120,0) 68%);
    opacity:0; pointer-events:none; z-index:1;
    transition:opacity 2.2s ease, transform 2.6s cubic-bezier(.22,.8,.3,1);
  }
  body.is-open .bg-glow{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ---------- layout ---------- */
  .stage{
    position:relative; z-index:5;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px 96px;
  }

  /* ---------- floating decorations above the box ---------- */
  .decor{ position:relative; width:min(78vw,340px); height:74px; pointer-events:none; z-index:6; }
  .decor span{ position:absolute; display:block; opacity:0; animation:decorFloat 5.2s ease-in-out infinite; }
  .decor .heart{ color:#e79fb2; font-size:19px; text-shadow:0 2px 10px rgba(231,159,178,.55); }
  .decor .star{ color:#d9ab55; font-size:15px; text-shadow:0 0 10px rgba(233,207,143,.9); }
  .decor span:nth-child(1){ left:6%;  top:26px; animation-delay:.2s; }
  .decor span:nth-child(2){ left:24%; top:4px;  animation-delay:1.4s; font-size:13px; }
  .decor span:nth-child(3){ left:47%; top:16px; animation-delay:.8s; }
  .decor span:nth-child(4){ left:66%; top:2px;  animation-delay:2s; font-size:12px; }
  .decor span:nth-child(5){ left:84%; top:24px; animation-delay:1.1s; }
  .decor span:nth-child(6){ left:36%; top:38px; animation-delay:2.6s; font-size:12px; }
  .decor span:nth-child(7){ left:58%; top:40px; animation-delay:.5s; font-size:17px; }
  @keyframes decorFloat{
    0%,100%{ opacity:0; transform:translateY(8px) rotate(-6deg) scale(.85); }
    35%{ opacity:.95; }
    55%{ opacity:.8; transform:translateY(-7px) rotate(6deg) scale(1.05); }
    75%{ opacity:.9; }
  }
  body.is-open .decor{ opacity:0; transition:opacity .8s ease; }

  /* ---------- gift box ---------- */
  .box-zone{
    position:relative; z-index:5;
    display:flex; flex-direction:column; align-items:center;
    transition:transform 1.6s cubic-bezier(.3,.7,.25,1), opacity 1.2s ease;
  }
  body.is-open .box-zone{ transform:translateY(21dvh) scale(.66); opacity:.92; }

  .halo{
    position:absolute; left:50%; top:44%; width:420px; height:420px; max-width:92vw;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,205,130,.5) 0%, rgba(255,205,130,0) 62%);
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease .35s;
  }
  body.is-opening .halo, body.is-open .halo{ opacity:1; }

  .scene{
    perspective:1100px;
    padding:64px 30px 6px;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    outline:none;
    animation:enterUp 1.1s cubic-bezier(.2,.75,.3,1) both .1s;
  }
  @keyframes enterUp{
    from{ opacity:0; transform:translateY(46px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .float-wrap{ animation:floaty 4.6s ease-in-out infinite; transform-origin:50% 80%; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-11px); } }
  body.is-opening .float-wrap, body.is-open .float-wrap{ animation:none; }

  .box3d{
    position:relative; width:var(--W); height:calc(var(--Hb) + var(--Hl));
    transform-style:preserve-3d;
    transform:rotateX(-7deg) rotateY(-17deg);
    transition:transform .5s ease, filter .5s ease;
  }
  .scene:hover .box3d, .scene:focus-visible .box3d{ transform:rotateX(-7deg) rotateY(-17deg) scale(1.045); filter:drop-shadow(0 0 22px rgba(233,190,110,.45)); }
  body.armed .box3d{ transform:rotateX(-7deg) rotateY(-17deg) scale(1.06); filter:drop-shadow(0 0 26px rgba(233,190,110,.6)); }
  body.is-opening .box3d, body.is-open .box3d{ transform:rotateX(-7deg) rotateY(-17deg); filter:none; }

  .face{ position:absolute; backface-visibility:hidden; }

  /* box body */
  .body-front{
    left:0; bottom:0; width:var(--W); height:var(--Hb);
    transform:translateZ(calc(var(--D)/2));
    background:linear-gradient(160deg, var(--wine-1) 0%, var(--wine-2) 55%, #93334a 100%);
    border-radius:4px 4px 7px 7px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -18px 26px rgba(60,8,20,.28), inset 0 10px 18px rgba(255,255,255,.10);
    overflow:hidden;
  }
  .body-right{
    bottom:0; left:calc(var(--W) - var(--D)/2); width:var(--D); height:var(--Hb);
    transform:rotateY(90deg);
    background:linear-gradient(200deg, #93334a 0%, var(--wine-3) 70%);
    border-radius:4px;
    box-shadow:inset 0 -18px 26px rgba(40,4,14,.35);
    overflow:hidden;
  }
  .mouth{
    left:0; bottom:calc(var(--Hb) - var(--D)/2); width:var(--W); height:var(--D);
    transform:rotateX(90deg);
    background:radial-gradient(ellipse at 50% 50%, #5d1424 0%, #3c0a16 70%);
    overflow:hidden;
  }
  .mouth-glow{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 55%, rgba(255,226,160,1) 0%, rgba(255,190,105,.75) 42%, rgba(255,170,90,0) 75%);
    opacity:0; transform:scale(.4);
    transition:opacity .9s ease .3s, transform 1.2s ease .3s;
  }
  body.is-opening .mouth-glow, body.is-open .mouth-glow{ opacity:1; transform:scale(1.25); }

  /* ribbons on the body */
  .ribbon-v, .ribbon-h{ position:absolute; background:linear-gradient(90deg,#a97c33 0%, #e9cf8f 30%, #f6e3ae 50%, #dcbc72 72%, #a97c33 100%); box-shadow:0 0 0 1px rgba(120,84,26,.25), inset 0 0 6px rgba(255,255,255,.35); transition:transform 1s cubic-bezier(.4,.6,.4,1) .25s, opacity .8s ease .3s; }
  .body-front .ribbon-v{ top:0; bottom:0; left:50%; width:36px; transform:translateX(-50%); }
  .body-front .ribbon-h{ left:0; right:0; top:50%; height:36px; transform:translateY(-50%); background:linear-gradient(180deg,#a97c33 0%, #e9cf8f 30%, #f6e3ae 50%, #dcbc72 72%, #a97c33 100%); }
  .body-right .ribbon-h{ left:0; right:0; top:50%; height:36px; transform:translateY(-50%); background:linear-gradient(180deg,#8f6626 0%, #c9a354 45%, #a97c33 100%); }
  body.is-opening .body-front .ribbon-v{ transform:translateX(-50%) translateY(46px); opacity:0; }
  body.is-opening .body-front .ribbon-h{ transform:translateY(60px) rotate(2deg); opacity:0; }
  body.is-opening .body-right .ribbon-h{ transform:translateY(60px); opacity:0; }
  body.is-open .body-front .ribbon-v, body.is-open .body-front .ribbon-h, body.is-open .body-right .ribbon-h{ opacity:0; }

  /* lid */
  .lid{
    position:absolute; left:-9px; bottom:calc(var(--Hb) - 5px);
    width:calc(var(--W) + 18px); height:var(--Hl);
    transform-style:preserve-3d;
    transition:transform 1.5s cubic-bezier(.3,.65,.25,1) .45s, opacity 1.1s ease 1s;
  }
  body.is-opening .lid, body.is-open .lid{
    transform:translate(-118px,-178px) rotate(-24deg) rotateX(38deg) rotateY(-14deg);
    opacity:.96;
  }
  .lid-front{
    left:0; bottom:0; width:calc(var(--W) + 18px); height:var(--Hl);
    transform:translateZ(calc((var(--D) + 18px)/2));
    background:linear-gradient(165deg, #cd6a7d 0%, var(--wine-1) 60%, var(--wine-2) 100%);
    border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), inset 0 -10px 16px rgba(60,8,20,.22);
    overflow:hidden;
  }
  .lid-right{
    bottom:0; left:calc(var(--W) + 18px - (var(--D) + 18px)/2); width:calc(var(--D) + 18px); height:var(--Hl);
    transform:rotateY(90deg);
    background:linear-gradient(200deg, var(--wine-2) 0%, var(--wine-3) 75%);
    border-radius:5px; overflow:hidden;
  }
  .lid-top{
    left:0; top:calc(-1 * (var(--D) + 18px)/2); width:calc(var(--W) + 18px); height:calc(var(--D) + 18px);
    transform:rotateX(90deg);
    background:linear-gradient(150deg, #d67e8f 0%, var(--wine-1) 65%, #b34a5e 100%);
    border-radius:6px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    overflow:hidden;
  }
  .lid .ribbon-v{ top:0; bottom:0; left:50%; width:36px; transform:translateX(-50%); }
  .lid-top .ribbon-v{ top:0; bottom:0; left:50%; width:36px; transform:translateX(-50%); }
  .lid-top .ribbon-h{ left:0; right:0; top:50%; height:36px; transform:translateY(-50%); background:linear-gradient(180deg,#a97c33 0%, #e9cf8f 30%, #f6e3ae 50%, #dcbc72 72%, #a97c33 100%); }

  /* bow (SVG, rides with the lid, then pops) */
  .bow{
    position:absolute; left:50%; top:-58px; width:172px; height:96px;
    transform:translateX(-50%) translateZ(70px);
    filter:drop-shadow(0 6px 8px rgba(90,50,10,.28));
    transition:transform .65s cubic-bezier(.34,1.4,.5,1), opacity .55s ease .12s;
    animation:bowSway 4.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes bowSway{ 0%,100%{ rotate:-1.6deg; } 50%{ rotate:1.6deg; } }
  body.is-opening .bow, body.is-open .bow{
    transform:translateX(-50%) translateZ(70px) translateY(-120px) rotate(26deg) scale(.82);
    opacity:0; animation:none;
  }

  .ground-shadow{
    width:250px; height:36px; margin-top:20px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(94,44,30,.34) 0%, rgba(94,44,30,0) 68%);
    animation:shadowPulse 4.6s ease-in-out infinite;
  }
  @keyframes shadowPulse{ 0%,100%{ transform:scaleX(1); opacity:.85; } 50%{ transform:scaleX(.88); opacity:.6; } }
  body.is-opening .ground-shadow, body.is-open .ground-shadow{ animation:none; transform:scaleX(.8); opacity:.5; transition:all 1.2s ease; }

  .caption{
    margin:26px 0 0; text-align:center;
    font-size:clamp(15px, 4.2vw, 18px); letter-spacing:.32em; text-indent:.32em;
    color:var(--brown-soft);
    animation:enterUp 1.1s cubic-bezier(.2,.75,.3,1) both .35s;
    transition:opacity .7s ease;
  }
  body.is-open .caption{ opacity:0; animation:none; }

  /* ---------- reveal text ---------- */
  .reveal{
    position:fixed; left:50%; top:44%; z-index:10;
    width:min(92vw, 640px);
    transform:translate(-50%,-50%) translateY(30px) scale(.94);
    text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.1s ease, transform 1.3s cubic-bezier(.22,.8,.3,1);
  }
  body.is-open .reveal{ opacity:1; transform:translate(-50%,-50%) translateY(0) scale(1); pointer-events:auto; transition-delay:.55s; }
  .reveal .rule{
    width:54px; height:1px; margin:0 auto 22px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    position:relative;
  }
  .reveal .rule::after{
    content:"✦"; position:absolute; left:50%; top:50%; transform:translate(-50%,-54%);
    color:var(--gold); font-size:11px; background:transparent; padding:0 6px;
  }
  .reveal .line1{
    margin:0; font-weight:600;
    font-size:clamp(21px, 6vw, 32px);
    letter-spacing:.42em; text-indent:.42em;
    color:var(--brown);
  }
  .reveal .line2{
    margin:10px 0 0; font-weight:900;
    font-size:clamp(40px, 11.5vw, 68px);
    letter-spacing:.14em; text-indent:.14em; line-height:1.25;
    background:linear-gradient(100deg, #5a3421 20%, #8a5a28 38%, #d9ab55 50%, #8a5a28 62%, #5a3421 80%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:sheen 4.5s ease-in-out infinite 2s;
  }
  @keyframes sheen{ 0%,100%{ background-position:110% 0; } 50%{ background-position:-10% 0; } }
  .reveal .sub{
    margin:24px 0 0;
    font-size:clamp(14px, 4vw, 17px);
    letter-spacing:.18em; text-indent:.18em;
    color:var(--brown-soft);
  }
  .reveal .apology{
    margin:28px auto 0;
    max-width:92%;
    font-size:clamp(17px, 5vw, 23px);
    font-weight:600;
    letter-spacing:.12em; text-indent:.12em;
    line-height:1.6;
    color:var(--brown);
    opacity:0;
    transform:translateY(14px);
    transition:opacity 1.1s ease, transform 1.2s cubic-bezier(.22,.8,.3,1);
  }
  .reveal .apology .sign{
    font-family:"Cormorant Garamond", "Noto Serif SC", serif;
    font-style:italic;
    letter-spacing:.06em;
    color:var(--gold);
    white-space:nowrap;
  }
  body.is-open .reveal .apology{
    opacity:1;
    transform:translateY(0);
    transition-delay:2.4s;
  }
  .heart-btn{
    margin-top:20px;
    width:56px; height:56px; min-height:56px;
    border:none; background:transparent; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%;
    transition:transform .25s ease;
  }
  .heart-btn:hover{ transform:scale(1.12); }
  .heart-btn:active{ transform:scale(.94); }
  .heart-btn svg{ width:40px; height:40px; filter:drop-shadow(0 4px 10px rgba(214,90,110,.45)); animation:heartbeat 2.2s ease-in-out infinite; }
  @keyframes heartbeat{ 0%,100%{ transform:scale(1); } 12%{ transform:scale(1.14); } 24%{ transform:scale(1); } 36%{ transform:scale(1.1); } 48%{ transform:scale(1); } }

  /* ---------- hint & replay ---------- */
  .hint{
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:8; margin:0; white-space:nowrap;
    font-size:clamp(13px, 3.8vw, 15px); letter-spacing:.3em; text-indent:.3em;
    color:var(--brown-soft);
    animation:hintPulse 2.4s ease-in-out infinite;
    transition:opacity .6s ease;
  }
  @keyframes hintPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  body.is-open .hint{ opacity:0 !important; animation:none; pointer-events:none; }

  .replay{
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:12;
    padding:9px 18px; min-height:40px;
    font-size:13.5px; letter-spacing:.14em;
    color:var(--brown);
    background:rgba(255,252,246,.82);
    border:1px solid rgba(184,137,63,.55); border-radius:999px;
    box-shadow:0 6px 18px rgba(120,80,40,.16);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    cursor:pointer;
    opacity:0; visibility:hidden; transform:translateY(8px);
    transition:opacity .7s ease .9s, transform .7s ease .9s, visibility 0s linear 1.6s, background .25s ease;
  }
  .replay:hover{ background:#fffaf0; }
  body.is-open .replay{ opacity:1; visibility:visible; transform:translateY(0); transition:opacity .7s ease .9s, transform .7s ease .9s, visibility 0s; }

  @media (max-width:480px){
    :root{ --W:196px; --D:82px; --Hb:118px; --Hl:40px; }
    .bow{ width:146px; height:82px; top:-50px; }
    .scene{ padding:56px 16px 4px; }
    .reveal{ top:42%; }
  }
  @media (prefers-reduced-motion: reduce){
    .float-wrap, .ground-shadow, .bow, .decor span, .hint, .heart-btn svg, .reveal .line2{ animation:none !important; }
    .lid, .bow, .reveal, .box-zone, .bg-glow{ transition-duration:.3s !important; transition-delay:0s !important; }
    body.is-open .reveal .apology{ transition-delay:.9s !important; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="bg-glow" aria-hidden="true"></div>

<main class="stage">
  <div class="decor" aria-hidden="true">
    <span class="heart">♥</span>
    <span class="star">✦</span>
    <span class="heart">♥</span>
    <span class="star">✦</span>
    <span class="heart">♥</span>
    <span class="star">✧</span>
    <span class="heart">♥</span>
  </div>

  <div class="box-zone">
    <div class="halo" aria-hidden="true"></div>
    <div class="scene" id="giftBox" role="button" tabindex="0" aria-label="礼物盒，双击开启惊喜">
      <div class="float-wrap">
        <div class="box3d">
          <!-- body -->
          <div class="face body-front">
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
          </div>
          <div class="face body-right">
            <div class="ribbon-h"></div>
          </div>
          <div class="face mouth"><div class="mouth-glow"></div></div>
          <!-- lid -->
          <div class="lid">
            <div class="face lid-front"><div class="ribbon-v"></div></div>
            <div class="face lid-right"></div>
            <div class="face lid-top">
              <div class="ribbon-v"></div>
              <div class="ribbon-h"></div>
            </div>
            <svg class="bow" viewBox="0 0 172 96" aria-hidden="true">
              <defs>
                <linearGradient id="goldBow" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#a97c33"/>
                  <stop offset=".32" stop-color="#e9cf8f"/>
                  <stop offset=".55" stop-color="#f6e3ae"/>
                  <stop offset=".78" stop-color="#dcbc72"/>
                  <stop offset="1" stop-color="#a97c33"/>
                </linearGradient>
              </defs>
              <path d="M84 52 L58 92 L74 94 L86 66 Z" fill="url(#goldBow)" stroke="#8a6224" stroke-width="1"/>
              <path d="M90 52 L118 90 L102 94 L88 66 Z" fill="url(#goldBow)" stroke="#8a6224" stroke-width="1"/>
              <path d="M86 46 C52 8, 10 14, 14 38 C17 58, 52 60, 86 52 Z" fill="url(#goldBow)" stroke="#8a6224" stroke-width="1.2"/>
              <path d="M86 46 C120 8, 162 14, 158 38 C155 58, 120 60, 86 52 Z" fill="url(#goldBow)" stroke="#8a6224" stroke-width="1.2"/>
              <path d="M84 46 C60 24, 30 24, 30 38 C30 50, 58 52, 84 50 Z" fill="#f6e3ae" opacity=".55"/>
              <path d="M88 46 C112 24, 142 24, 142 38 C142 50, 114 52, 88 50 Z" fill="#f6e3ae" opacity=".55"/>
              <rect x="74" y="38" width="24" height="22" rx="7" fill="url(#goldBow)" stroke="#8a6224" stroke-width="1.2"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <div class="ground-shadow" aria-hidden="true"></div>
    <p class="caption">有一份特别的礼物，送给特别的你</p>
  </div>
</main>

<section class="reveal" aria-live="polite">
  <div class="rule" aria-hidden="true"></div>
  <p class="line1">老婆给我买的</p>
  <h1 class="line2">衣服最好看 ♡</h1>
  <p class="sub">因为是你挑的，所以每一件都好看。</p>
  <p class="apology">老婆，不要生气了——<span class="sign">爱你的 zyz</span></p>
  <button class="heart-btn" id="heartBtn" type="button" aria-label="送出爱心">
    <svg viewBox="0 0 48 44" aria-hidden="true">
      <defs>
        <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e88ba0"/>
          <stop offset=".55" stop-color="#d65a6e"/>
          <stop offset="1" stop-color="#b83a52"/>
        </linearGradient>
      </defs>
      <path d="M24 40 C10 30, 3 21.5, 3 13.5 C3 6.8, 8.2 2.5, 14 2.5 C18.2 2.5, 21.8 4.8, 24 8.2 C26.2 4.8, 29.8 2.5, 34 2.5 C39.8 2.5, 45 6.8, 45 13.5 C45 21.5, 38 30, 24 40 Z" fill="url(#heartGrad)"/>
      <ellipse cx="15" cy="11" rx="5.5" ry="3.6" fill="#ffffff" opacity=".38" transform="rotate(-24 15 11)"/>
    </svg>
  </button>
</section>

<p class="hint" id="hint">双击礼盒，开启惊喜 ♡</p>
<button class="replay" id="replayBtn" type="button">再打开一次</button>

<script>
(function(){
  "use strict";
  var body = document.body;
  var box = document.getElementById('giftBox');
  var hint = document.getElementById('hint');
  var replayBtn = document.getElementById('replayBtn');
  var heartBtn = document.getElementById('heartBtn');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var state = 'idle'; /* idle | opening | open */
  var lastTap = 0, armTimer = null;

  /* ================= canvas particles ================= */
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var particles = [];
  var COLORS = ['#d9ab55','#e9cf8f','#e79fb2','#d65a6e','#f2b879','#c9903f'];

  function drawHeart(x, y, s, rot, color, alpha){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 3.2);
    ctx.bezierCurveTo(-5.4, -1.6, -3.4, -6.4, 0, -3.4);
    ctx.bezierCurveTo(3.4, -6.4, 5.4, -1.6, 0, 3.2);
    ctx.fill(); ctx.restore();
  }
  function drawStar(x, y, s, rot, color, alpha){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 8; i++){
      var r = (i % 2 === 0) ? s : s * 0.32;
      var a = (Math.PI / 4) * i - Math.PI / 2;
      var px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function drawDot(x, y, s, color, alpha){
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  function spawn(o){ particles.push(o); }
  function burst(cx, cy, count, opts){
    opts = opts || {};
    var power = opts.power || 1;
    for (var i = 0; i < count; i++){
      var ang = Math.random() * Math.PI * 2;
      var spd = (1.2 + Math.random() * 4.6) * power;
      var kind = Math.random();
      spawn({
        x: cx + (Math.random() - .5) * 30, y: cy + (Math.random() - .5) * 16,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2.4 * power,
        size: 4 + Math.random() * 8,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * .16,
        life: 1, decay: .006 + Math.random() * .009,
        grav: opts.float ? -0.012 : 0.045,
        drag: .988,
        type: kind < .42 ? 'heart' : (kind < .72 ? 'star' : 'dot'),
        color: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
  }
  function ambientSparkle(idle){
    var y = idle ? H * (0.06 + Math.random() * 0.44) : H * (0.25 + Math.random() * 0.7);
    spawn({
      x: Math.random() * W, y: y,
      vx: (Math.random() - .5) * .25, vy: -(0.25 + Math.random() * .55),
      size: 2.5 + Math.random() * 5,
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .03,
      life: .9, decay: .004 + Math.random() * .004,
      grav: -0.002, drag: .999,
      type: Math.random() < .3 ? 'heart' : 'star',
      color: COLORS[(Math.random() * COLORS.length) | 0]
    });
  }

  var lastAmbient = 0;
  function loop(ts){
    ctx.clearRect(0, 0, W, H);
    if (!reduced && state === 'open' && ts - lastAmbient > 260){
      lastAmbient = ts; ambientSparkle(false);
    }
    if (!reduced && state === 'idle' && ts - lastAmbient > 700){
      lastAmbient = ts; ambientSparkle(true);
    }
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.vy += p.grav; p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      if (p.life <= 0 || p.y < -30 || p.y > H + 30){ particles.splice(i, 1); continue; }
      var a = Math.max(p.life, 0);
      if (p.type === 'heart') drawHeart(p.x, p.y, p.size / 5, p.rot, p.color, a);
      else if (p.type === 'star') drawStar(p.x, p.y, p.size, p.rot, p.color, a);
      else drawDot(p.x, p.y, p.size * .32, p.color, a);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= opening sequence ================= */
  function boxCenter(){
    var r = box.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 - 20 };
  }
  function openGift(){
    if (state !== 'idle') return;
    state = 'opening';
    body.classList.remove('armed');
    body.classList.add('is-opening');
    hint.textContent = '';
    var c = boxCenter();
    var burstDelay = reduced ? 60 : 620;
    var openDelay = reduced ? 200 : 1450;
    setTimeout(function(){ burst(c.x, c.y, reduced ? 24 : 90, { power: 1.15 }); }, burstDelay);
    setTimeout(function(){ burst(c.x, c.y - 30, reduced ? 10 : 34, { power: .7, float: true }); }, burstDelay + 260);
    setTimeout(function(){
      state = 'open';
      body.classList.remove('is-opening');
      body.classList.add('is-open');
    }, openDelay);
  }

  function arm(){
    body.classList.add('armed');
    hint.textContent = '再点一次，打开礼盒 ♡';
    clearTimeout(armTimer);
    armTimer = setTimeout(function(){
      body.classList.remove('armed');
      hint.textContent = '双击礼盒，开启惊喜 ♡';
    }, 1600);
  }

  box.addEventListener('dblclick', function(e){ e.preventDefault(); openGift(); });
  box.addEventListener('click', function(){
    if (state !== 'idle') return;
    if (body.classList.contains('armed')){ clearTimeout(armTimer); openGift(); }
    else { arm(); }
  });
  box.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGift(); }
  });

  /* ================= heart burst ================= */
  heartBtn.addEventListener('click', function(){
    var r = heartBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, reduced ? 14 : 42, { power: .85, float: true });
  });

  /* ================= replay ================= */
  replayBtn.addEventListener('click', function(){
    if (state !== 'open') return;
    state = 'idle';
    body.classList.remove('is-open');
    particles.length = 0;
    lastTap = 0;
    hint.textContent = '双击礼盒，开启惊喜 ♡';
  });
})();
</script>
</body>
</html>
